name: Daily AI Portfolio Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  run-agent:
    # Only run on issue comments if the issue title starts with "Daily Update"
    if: ${{ github.event_name != 'issue_comment' || startsWith(github.event.issue.title, 'Daily Update') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install NPM dependencies
        run: npm install

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AI Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agent.py
